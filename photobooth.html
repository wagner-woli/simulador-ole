<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Photo Booth Woli</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #0d1b2e;
      font-family: 'Montserrat', sans-serif;
      color: #fff;
      touch-action: none;
    }

    #app { height: 100%; display: flex; flex-direction: column; }

    /* ── CAMERA VIEW ── */
    #camera-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    #video-wrap {
      position: relative;
      flex: 1;
      overflow: hidden;
      background: #000;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    #video.mirror { transform: scaleX(-1); }

    /* Mascote sobreposto ao vídeo */
    #mascot {
      position: absolute;
      transform: translate(-50%, -50%);
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    #mascot:active { cursor: grabbing; }

    /* ── CONTROLES ── */
    #controls {
      background: #0d1b2e;
      padding: 10px 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .ctrl-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.1);
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .ctrl-btn:active { background: rgba(255,255,255,0.25); }

    #capture-btn {
      width: 66px;
      height: 66px;
      background: #fff;
      border: 3px solid #4a90e2;
      font-size: 28px;
      flex-shrink: 0;
    }
    #capture-btn:active { background: #e0eeff; }

    .size-control {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .size-label {
      font-size: 10px;
      font-weight: 600;
      color: rgba(255,255,255,0.45);
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    #size-slider {
      width: 100%;
      height: 6px;
      -webkit-appearance: none;
      appearance: none;
      background: rgba(255,255,255,0.2);
      border-radius: 3px;
      outline: none;
    }
    #size-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #4a90e2;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }
    #size-slider::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #4a90e2;
      cursor: pointer;
      border: none;
    }

    /* ── RESULTADO ── */
    #result-view {
      display: none;
      flex-direction: column;
      align-items: center;
      height: 100%;
      background: #0d1b2e;
    }
    #result-view.active { display: flex; }

    #result-canvas {
      flex: 1;
      width: 100%;
      object-fit: contain;
      display: block;
    }

    #result-actions {
      width: 100%;
      padding: 14px 16px 24px;
      display: flex;
      gap: 10px;
    }

    .action-btn {
      flex: 1;
      padding: 14px 8px;
      border-radius: 12px;
      border: none;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    #retry-btn    { background: rgba(255,255,255,0.12); color: #fff; }
    #download-btn { background: #1a3a8f; color: #fff; }
    #share-btn    { background: #4a90e2; color: #fff; }

    /* ── PERMISSÃO ── */
    #perm-overlay {
      position: fixed;
      inset: 0;
      background: #0d1b2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 100;
      padding: 40px;
      text-align: center;
    }
    #perm-overlay.hidden { display: none; }
    #perm-overlay .icon { font-size: 72px; }
    #perm-overlay h2 { font-size: 22px; font-weight: 800; line-height: 1.3; }
    #perm-overlay p { color: rgba(255,255,255,0.55); font-size: 14px; line-height: 1.7; }
    #allow-btn {
      background: #1a3a8f;
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 16px 36px;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    #allow-btn:active { background: #2a4aaf; }

    /* ── DICA ── */
    #hint {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.55);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 20px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 1;
      transition: opacity 1s;
    }
    #hint.hide { opacity: 0; }
  </style>
</head>
<body>
<div id="app">

  <!-- CÂMERA -->
  <div id="camera-view">
    <div id="video-wrap">
      <video id="video" autoplay playsinline muted></video>
      <img id="mascot" src="" alt="mascote" draggable="false">
      <div id="hint">Arraste a mascote · Pinça para redimensionar</div>
    </div>
    <div id="controls">
      <button class="ctrl-btn" id="flip-btn" title="Virar câmera">&#x21BA;</button>
      <button class="ctrl-btn" id="capture-btn" title="Tirar foto">&#x1F4F8;</button>
      <div class="size-control">
        <div class="size-label">Tamanho da mascote</div>
        <input type="range" id="size-slider" min="60" max="500" value="200">
      </div>
    </div>
  </div>

  <!-- RESULTADO -->
  <div id="result-view">
    <canvas id="result-canvas"></canvas>
    <div id="result-actions">
      <button class="action-btn" id="retry-btn">Nova foto</button>
      <button class="action-btn" id="download-btn">Baixar</button>
      <button class="action-btn" id="share-btn">Compartilhar</button>
    </div>
  </div>

  <!-- PERMISSÃO -->
  <div id="perm-overlay">
    <div class="icon">&#x1F916;</div>
    <h2>Foto com a Mascote Woli</h2>
    <p>Para tirar sua foto com a mascote,<br>precisamos acessar sua câmera.</p>
    <button id="allow-btn">Liberar câmera</button>
  </div>

</div>
<script>
// ─── CONFIG ────────────────────────────────────────────────────────────────
// Coloque aqui a URL da mascote (PNG com fundo transparente).
// Se o arquivo mascot.png estiver na mesma pasta, deixe como está.
const MASCOT_SRC    = 'mascot.png';

// Tamanho inicial: porcentagem da altura da área de câmera.
// 0.38 = 38% → parece natural tanto no celular quanto no monitor.
const INITIAL_RATIO = 0.38;

// ─── ELEMENTOS ─────────────────────────────────────────────────────────────
const video        = document.getElementById('video');
const mascotEl     = document.getElementById('mascot');
const sizeSlider   = document.getElementById('size-slider');
const captureBtn   = document.getElementById('capture-btn');
const flipBtn      = document.getElementById('flip-btn');
const videoWrap    = document.getElementById('video-wrap');
const cameraView   = document.getElementById('camera-view');
const resultView   = document.getElementById('result-view');
const resultCanvas = document.getElementById('result-canvas');
const downloadBtn  = document.getElementById('download-btn');
const shareBtn     = document.getElementById('share-btn');
const retryBtn     = document.getElementById('retry-btn');
const permOverlay  = document.getElementById('perm-overlay');
const allowBtn     = document.getElementById('allow-btn');
const hint         = document.getElementById('hint');

// ─── ESTADO ────────────────────────────────────────────────────────────────
let facingMode = 'user';   // 'user' = frontal | 'environment' = traseira
let stream     = null;
let mascotX    = 0;        // centro X dentro de videoWrap (px)
let mascotY    = 0;        // centro Y dentro de videoWrap (px)
let mascotH    = 200;      // altura atual da mascote (px)

// drag
let dragging = false;
let dragOX = 0, dragOY = 0;

// pinch
let pinching   = false;
let pinchDist0 = 0;
let pinchH0    = 0;

// ─── CÂMERA ────────────────────────────────────────────────────────────────
async function startCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode, width: { ideal: 1280 }, height: { ideal: 960 } },
      audio: false,
    });
    video.srcObject = stream;
    video.classList.toggle('mirror', facingMode === 'user');
    permOverlay.classList.add('hidden');
    // Ao receber os metadados do vídeo, posicionar mascote
    video.addEventListener('loadedmetadata', resetMascot, { once: true });
  } catch (err) {
    alert('Não foi possível acessar a câmera: ' + err.message);
  }
}

// ─── MASCOTE ───────────────────────────────────────────────────────────────
mascotEl.src = MASCOT_SRC;

mascotEl.addEventListener('error', () => {
  // Fallback: robô SVG embutido
  mascotEl.src = buildSvgRobot();
});

mascotEl.addEventListener('load', resetMascot);

function resetMascot() {
  const h = videoWrap.clientHeight || window.innerHeight * 0.8;
  const w = videoWrap.clientWidth  || window.innerWidth;

  mascotH = Math.round(h * INITIAL_RATIO);
  mascotX = Math.round(w * 0.22);
  mascotY = Math.round(h * 0.72);

  sizeSlider.min   = Math.round(h * 0.08);
  sizeSlider.max   = Math.round(h * 0.92);
  sizeSlider.value = mascotH;

  applyMascot();
}

function applyMascot() {
  mascotEl.style.height = mascotH + 'px';
  mascotEl.style.width  = 'auto';
  mascotEl.style.left   = mascotX + 'px';
  mascotEl.style.top    = mascotY + 'px';
}

// Slider de tamanho
sizeSlider.addEventListener('input', () => {
  mascotH = parseInt(sizeSlider.value);
  applyMascot();
});

// ─── DRAG — MOUSE ──────────────────────────────────────────────────────────
mascotEl.addEventListener('mousedown', e => {
  e.preventDefault();
  dragging = true;
  const r = videoWrap.getBoundingClientRect();
  dragOX = (e.clientX - r.left) - mascotX;
  dragOY = (e.clientY - r.top)  - mascotY;
});

document.addEventListener('mousemove', e => {
  if (!dragging) return;
  const r = videoWrap.getBoundingClientRect();
  mascotX = clamp((e.clientX - r.left) - dragOX, 0, r.width);
  mascotY = clamp((e.clientY - r.top)  - dragOY, 0, r.height);
  applyMascot();
});

document.addEventListener('mouseup', () => { dragging = false; });

// ─── DRAG + PINCH — TOUCH ──────────────────────────────────────────────────
mascotEl.addEventListener('touchstart', e => {
  e.preventDefault();
  hideHint();
  if (e.touches.length === 1) {
    dragging = true;
    pinching = false;
    const r = videoWrap.getBoundingClientRect();
    const t = e.touches[0];
    dragOX = (t.clientX - r.left) - mascotX;
    dragOY = (t.clientY - r.top)  - mascotY;
  } else if (e.touches.length === 2) {
    dragging = false;
    pinching = true;
    pinchDist0 = touchDist(e.touches);
    pinchH0    = mascotH;
  }
}, { passive: false });

mascotEl.addEventListener('touchmove', e => {
  e.preventDefault();
  if (dragging && e.touches.length === 1) {
    const r = videoWrap.getBoundingClientRect();
    const t = e.touches[0];
    mascotX = clamp((t.clientX - r.left) - dragOX, 0, r.width);
    mascotY = clamp((t.clientY - r.top)  - dragOY, 0, r.height);
    applyMascot();
  } else if (pinching && e.touches.length === 2) {
    const ratio = touchDist(e.touches) / pinchDist0;
    const maxH  = videoWrap.clientHeight * 0.95;
    const minH  = 60;
    mascotH = clamp(pinchH0 * ratio, minH, maxH);
    sizeSlider.value = mascotH;
    applyMascot();
  }
}, { passive: false });

mascotEl.addEventListener('touchend', e => {
  if (e.touches.length < 2) pinching = false;
  if (e.touches.length === 0) dragging = false;
}, { passive: false });

function touchDist(touches) {
  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;
  return Math.hypot(dx, dy);
}

function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

// ─── VIRAR CÂMERA ──────────────────────────────────────────────────────────
flipBtn.addEventListener('click', () => {
  facingMode = facingMode === 'user' ? 'environment' : 'user';
  startCamera();
});

// ─── CAPTURA ───────────────────────────────────────────────────────────────
captureBtn.addEventListener('click', () => {
  const vw = video.videoWidth;
  const vh = video.videoHeight;
  if (!vw || !vh) return;

  const dw = videoWrap.clientWidth;
  const dh = videoWrap.clientHeight;

  // Área visível do vídeo (object-fit: cover)
  const vAR = vw / vh;
  const dAR = dw / dh;
  let srcX, srcY, srcW, srcH;
  if (vAR > dAR) {
    srcH = vh; srcW = vh * dAR;
    srcX = (vw - srcW) / 2; srcY = 0;
  } else {
    srcW = vw; srcH = vw / dAR;
    srcX = 0; srcY = (vh - srcH) / 2;
  }

  // Renderiza em 2× para qualidade
  const scale = 2;
  resultCanvas.width  = dw * scale;
  resultCanvas.height = dh * scale;
  const ctx = resultCanvas.getContext('2d');

  // --- Vídeo ---
  ctx.save();
  ctx.scale(scale, scale);
  if (facingMode === 'user') {
    // Espelha para manter o que o usuário viu no preview
    ctx.translate(dw, 0);
    ctx.scale(-1, 1);
  }
  ctx.drawImage(video, srcX, srcY, srcW, srcH, 0, 0, dw, dh);
  ctx.restore();

  // --- Mascote (posição identica ao preview) ---
  if (mascotEl.naturalWidth && mascotEl.naturalHeight) {
    const ar = mascotEl.naturalWidth / mascotEl.naturalHeight;
    const mH = mascotH * scale;
    const mW = mH * ar;
    const mX = mascotX * scale;
    const mY = mascotY * scale;
    ctx.drawImage(mascotEl, mX - mW / 2, mY - mH / 2, mW, mH);
  }

  // --- Marca Woli ---
  const barH = 30 * scale;
  ctx.fillStyle = 'rgba(13,27,46,0.75)';
  ctx.fillRect(0, resultCanvas.height - barH, resultCanvas.width, barH);
  ctx.fillStyle = '#ffffff';
  ctx.font = `bold ${13 * scale}px Montserrat, sans-serif`;
  ctx.textAlign = 'center';
  ctx.fillText(
    'Foto com a Mascote Woli · photobooth-woli.netlify.app',
    resultCanvas.width / 2,
    resultCanvas.height - 8 * scale
  );

  // Exibir resultado
  cameraView.style.display = 'none';
  resultView.classList.add('active');
});

// ─── AÇÕES DO RESULTADO ────────────────────────────────────────────────────
retryBtn.addEventListener('click', () => {
  resultView.classList.remove('active');
  cameraView.style.display = '';
});

downloadBtn.addEventListener('click', () => {
  const a = document.createElement('a');
  a.href     = resultCanvas.toDataURL('image/jpeg', 0.92);
  a.download = 'foto-mascote-woli.jpg';
  a.click();
});

shareBtn.addEventListener('click', async () => {
  if (!navigator.share) { downloadBtn.click(); return; }
  try {
    const blob = await new Promise(r => resultCanvas.toBlob(r, 'image/jpeg', 0.92));
    const file = new File([blob], 'foto-mascote-woli.jpg', { type: 'image/jpeg' });
    await navigator.share({ files: [file], title: 'Foto com a Mascote Woli' });
  } catch (e) {
    if (e.name !== 'AbortError') downloadBtn.click();
  }
});

// ─── HINT ──────────────────────────────────────────────────────────────────
let hintTimer = setTimeout(hideHint, 5000);
function hideHint() {
  clearTimeout(hintTimer);
  hint.classList.add('hide');
}

// ─── SVG ROBÔ FALLBACK ─────────────────────────────────────────────────────
function buildSvgRobot() {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 210">
    <line x1="60" y1="8" x2="60" y2="28" stroke="#1a3a8f" stroke-width="4"/>
    <circle cx="60" cy="6" r="7" fill="#e74c3c"/>
    <rect x="22" y="28" width="76" height="56" rx="14" fill="#4a90e2"/>
    <circle cx="44" cy="54" r="11" fill="#fff"/>
    <circle cx="76" cy="54" r="11" fill="#fff"/>
    <circle cx="44" cy="54" r="6"  fill="#1a3a8f"/>
    <circle cx="76" cy="54" r="6"  fill="#1a3a8f"/>
    <circle cx="46" cy="52" r="2"  fill="#fff"/>
    <circle cx="78" cy="52" r="2"  fill="#fff"/>
    <path d="M42 74 Q60 86 78 74" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
    <rect x="48" y="84" width="24" height="12" rx="4" fill="#3a7bc8"/>
    <rect x="18" y="96" width="84" height="68" rx="12" fill="#1a3a8f"/>
    <circle cx="32" cy="120" r="5" fill="#4a90e2" opacity=".7"/>
    <circle cx="32" cy="136" r="5" fill="#4a90e2" opacity=".7"/>
    <text x="60" y="148" text-anchor="middle" fill="#fff" font-size="30" font-weight="900" font-family="Arial">W</text>
    <rect x="2"  y="96" width="16" height="46" rx="8" fill="#4a90e2"
          transform="rotate(-25 10 96)"/>
    <rect x="102" y="96" width="16" height="46" rx="8" fill="#4a90e2"
          transform="rotate(15 110 96)"/>
    <rect x="28" y="164" width="24" height="36" rx="9" fill="#3a7bc8"/>
    <rect x="68" y="164" width="24" height="36" rx="9" fill="#3a7bc8"/>
    <rect x="20" y="192" width="34" height="14" rx="7" fill="#1a3a8f"/>
    <rect x="66" y="192" width="34" height="14" rx="7" fill="#1a3a8f"/>
  </svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

// ─── PERMISSÃO ─────────────────────────────────────────────────────────────
allowBtn.addEventListener('click', startCamera);

// ─── RESIZE ────────────────────────────────────────────────────────────────
window.addEventListener('resize', resetMascot);

// ─── INIT ──────────────────────────────────────────────────────────────────
startCamera();
</script>
</body>
</html>
